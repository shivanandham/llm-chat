<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Free LLM Chat</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0d1117; color: #e6edf3; display: flex; flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid #21262d; display: flex;
    align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .badge {
    font-size: 12px; color: #7d8590; background: #161b22; border: 1px solid #21262d;
    padding: 2px 8px; border-radius: 999px;
  }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 760px; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.5; }
  .user { align-self: flex-end; background: #1f6feb; color: #fff; }
  .assistant { align-self: flex-start; background: #161b22; border: 1px solid #21262d; }
  .meta { font-size: 11px; color: #7d8590; margin-top: 6px; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #21262d; }
  textarea {
    flex: 1; resize: none; background: #0d1117; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 8px; padding: 10px; font: inherit; min-height: 44px; max-height: 160px;
  }
  button {
    background: #238636; color: #fff; border: 0; border-radius: 8px; padding: 0 18px;
    font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <header>
    <h1>Free LLM Chat</h1>
    <span class="badge" id="providers">loading providers…</span>
  </header>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" placeholder="Ask anything… (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send" type="submit">Send</button>
  </form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const history = [];

async function loadProviders() {
  try {
    const r = await fetch('/providers');
    const data = await r.json();
    const on = data.filter(p => p.enabled).map(p => p.name);
    document.getElementById('providers').textContent =
      on.length ? `${on.length} provider(s): ${on.join(', ')}` : 'no providers configured — see docs/GET_API_KEYS.md';
  } catch { /* ignore */ }
}

function addMsg(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  const body = document.createElement('span');
  body.className = 'body';
  body.textContent = text;
  el.appendChild(body);
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function setBody(el, text) { el.querySelector('.body').textContent = text; }

function setMeta(el, text) {
  let m = el.querySelector('.meta');
  if (!m) { m = document.createElement('div'); m.className = 'meta'; el.appendChild(m); }
  m.textContent = text;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  addMsg('user', text);
  history.push({ role: 'user', content: text });

  const bubble = addMsg('assistant', '');
  let answer = '';
  let routeLabel = '';

  try {
    const resp = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.replace(/^data: /, '').trim();
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.event === 'route') { routeLabel = `${ev.provider} · ${ev.model}`; setMeta(bubble, routeLabel); }
        else if (ev.event === 'delta') { answer += ev.content; setBody(bubble, answer); setMeta(bubble, routeLabel); }
        else if (ev.event === 'error') { answer += `\n[error] ${ev.error}`; setBody(bubble, answer); }
      }
      log.scrollTop = log.scrollHeight;
    }
    history.push({ role: 'assistant', content: answer });
  } catch (err) {
    bubble.textContent = 'Request failed: ' + err;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

loadProviders();
</script>
</body>
</html>
